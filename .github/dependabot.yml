version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: mcp
        versions: ['>=2']
      - dependency-name: mypy
        update-types: ['version-update:semver-major']
