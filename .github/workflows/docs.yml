name: Docs

on:
  push:
    branches: [master]
    paths: ['docs/**', '.github/workflows/docs.yml']
  pull_request:
    branches: [master]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: oddship/moat/.github/workflows/build-docs.yml@7f024a399bd850e8650af1ab38fb62d1d13d1e93
    with:
      docs_dir: docs
      moat_version: v0.7.0
