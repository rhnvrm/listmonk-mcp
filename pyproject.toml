[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "listmonk-mcp"
version = "0.2.0"
description = "MCP server for Listmonk newsletter management"
authors = [
    { name = "Rohan Verma", email = "hello@rohanverma.net" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["listmonk", "mcp", "newsletter", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=1.30.0,<2",
    "httpx>=0.28.1,<1",
    "pydantic[email]>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1,<2",
    "pytest-httpx>=0.35,<1",
    "pytest-cov>=6,<8",
    "aiosmtpd>=1.4.6,<2",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "twine>=7,<8",
]

[project.urls]
Homepage = "https://github.com/rhnvrm/listmonk-mcp"
Documentation = "https://rhnvrm.github.io/listmonk-mcp/"
Repository = "https://github.com/rhnvrm/listmonk-mcp"
Issues = "https://github.com/rhnvrm/listmonk-mcp/issues"
Changelog = "https://github.com/rhnvrm/listmonk-mcp/blob/master/CHANGELOG.md"

[project.scripts]
listmonk-mcp = "listmonk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/listmonk_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["listmonk_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
